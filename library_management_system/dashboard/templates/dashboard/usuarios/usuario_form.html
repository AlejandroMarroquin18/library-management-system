{% extends 'dashboard/base_dashboard.html' %}

{% block title %}Editar Usuario{% endblock %}

{% block content %}
<div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-2 mb-4">
    <div>
        <h1 class="page-title">Editar usuario: {{ object.username }}</h1>
        <p class="page-subtitle">Actualiza rol y datos de acceso del usuario</p>
    </div>
    <a href="{% url 'dashboard:usuario_list' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Volver a la lista</a>
</div>

<div class="dashboard-card shadow-sm" style="max-width: 760px;">
    <div class="card-body p-4">
    <form method="post" novalidate>
        {% csrf_token %}
        <div class="django-form-container">
            {{ form.as_p }}
        </div>
        <div class="d-flex gap-2 align-items-center mt-3">
            <button type="submit" class="btn btn-accent">Actualizar usuario</button>
            <a href="{% url 'dashboard:usuario_list' %}" class="btn btn-light border">Cancelar</a>
        </div>
    </form>
    </div>
</div>
{% endblock %}
