{% extends 'dashboard/base_dashboard.html' %}

{% block title %}Eliminar Editorial{% endblock %}

{% block content %}
<div class="dashboard-card shadow-sm mx-auto" style="max-width: 560px;">
    <div class="card-body p-4 p-md-5 text-center">
        <div class="text-danger mb-3"><i class="bi bi-exclamation-octagon-fill fs-2"></i></div>
        <h1 class="h4 text-danger mb-3">Confirmar eliminacion</h1>
        <p class="text-muted mb-4">Estas a punto de eliminar la editorial <strong>{{ object.nombre }}</strong>. Esta accion no se puede deshacer.</p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <button type="submit" class="btn btn-danger">Si, eliminar</button>
                <a href="{% url 'dashboard:editorial_list' %}" class="btn btn-light border">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
