{% extends 'base.html' %}

{% block title %}Editar reseña | Mi Librería{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h1 class="h4 fw-bold mb-1">Editar reseña</h1>
                <p class="text-muted small mb-4">{{ review.libro.titulo }}</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-accent">Guardar cambios</button>
                        <a href="{% url 'libro_detail' review.libro_id %}" class="btn btn-light border">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
