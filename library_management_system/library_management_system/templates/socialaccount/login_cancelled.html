{% extends 'base.html' %}

{% block title %}Acceso cancelado | Mi Librería{% endblock %}

{% block content %}
<div class="row justify-content-center py-4 py-md-5">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 text-center">
            <div class="card-body p-4 p-md-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-light text-secondary rounded-circle mb-4" style="width: 64px; height: 64px;">
                    <i class="bi bi-x-lg fs-3"></i>
                </div>
                <h1 class="h4 fw-bold text-slate-800 mb-2">Acceso cancelado</h1>
                <p class="text-muted mb-4">No se vinculó ninguna cuenta de Google. Puedes volver a intentarlo cuando quieras.</p>
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                    <a href="{% url 'login' %}" class="btn btn-accent"><i class="bi bi-google me-1"></i>Intentar de nuevo</a>
                    <a href="{% url 'home' %}" class="btn btn-light border">Ir al catálogo</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
