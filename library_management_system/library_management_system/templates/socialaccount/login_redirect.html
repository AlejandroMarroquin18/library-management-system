{% extends 'base.html' %}

{% block title %}Conectando con Google | Mi Librería{% endblock %}

{% block extra_css %}
<style>
    .oauth-card {
        max-width: 34rem;
        border: 1px solid var(--brand-border);
        border-radius: 1rem;
        background: #ffffff;
    }

    .oauth-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--brand-blue-soft);
        color: var(--brand-blue-accent);
        font-size: 1.75rem;
    }
</style>
{% endblock %}

{% block content %}
<meta http-equiv="refresh" content="0; url={{ redirect_to }}">
<div class="row justify-content-center py-4 py-md-5">
    <div class="col-12 col-md-8">
        <div class="card oauth-card shadow-sm mx-auto">
            <div class="card-body p-4 p-md-5 text-center">
                <div class="oauth-icon mb-4" aria-hidden="true">
                    <i class="bi bi-google"></i>
                </div>
                <h1 class="h4 fw-bold text-slate-800 mb-2">Conectando tu cuenta</h1>
                <p class="text-muted mb-4">Estamos terminando el acceso con {{ provider }}.</p>
                <div class="spinner-border text-info mb-4" role="status" aria-label="Cargando"></div>
                <p class="small text-muted mb-0">Si la página no avanza, <a href="{{ redirect_to }}">continúa manualmente</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
