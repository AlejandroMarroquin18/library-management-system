{% extends 'base.html' %}

{% block title %}No se pudo iniciar sesión | Mi Librería{% endblock %}

{% block content %}
<div class="row justify-content-center py-4 py-md-5">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm border-0 text-center">
            <div class="card-body p-4 p-md-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-warning-subtle text-warning-emphasis rounded-circle mb-4" style="width: 64px; height: 64px;">
                    <i class="bi bi-shield-exclamation fs-3"></i>
                </div>
                <h1 class="h4 fw-bold text-slate-800 mb-2">No pudimos conectar con Google</h1>
                <p class="text-muted mb-4">La autorización no se completó. Puedes intentarlo de nuevo o acceder con tu cuenta habitual.</p>
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-2">
                    <a href="{% url 'login' %}" class="btn btn-accent"><i class="bi bi-arrow-left me-1"></i>Volver al acceso</a>
                    <a href="{% url 'home' %}" class="btn btn-light border">Ir al catálogo</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
